# Deploys groundapp.live from GitHub. Every push runs this:
#   main         -> https://groundapp.live (production)
#   other branch -> https://<branch>.groundapp.pages.dev (preview, behind Cloudflare Access)
# Rules for people and agents: AGENTS.md
name: Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# deployments: write lets the run attach its link to the commit, so the pull request
# shows a "View deployment" button (on github.com and in the GitHub app).
permissions:
  contents: read
  deployments: write

# One deploy per branch at a time, so two pushes can't race each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse private files in site/
        run: ./scripts/check-site.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Blog pages match content/posts
        run: |
          pip install --quiet markdown==3.9
          python3 scripts/build_blog.py
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::site/blog is out of date. Run python3 scripts/build_blog.py and commit what it changes."
            git status --porcelain
            exit 1
          fi

      - name: Check branch name
        id: branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Branch names may only use letters, numbers, . _ / and -"
            exit 1
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Upload to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: b1d1286405562ce47c7ef83c2376f1d2
          wranglerVersion: "4.72.0"
          command: pages deploy --project-name=groundapp --branch=${{ steps.branch.outputs.name }} --commit-hash=${{ github.sha }}

      - name: Links
        env:
          GH_TOKEN: ${{ github.token }}
          ENVIRONMENT: ${{ steps.deploy.outputs.pages-environment }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [ "$ENVIRONMENT" = "production" ]; then
            env_name=Production; prod=true; link=https://groundapp.live
          else
            env_name=Preview; prod=false; link="${ALIAS:-$URL}"
          fi
          {
            if [ "$prod" = true ]; then
              echo "### Live: $link"
            else
              echo "### Preview: $link"
              echo "Sign in with Collin's Cloudflare login to view it. The signup form and /admin don't work on previews."
            fi
            echo "This deploy: $URL"
          } >> "$GITHUB_STEP_SUMMARY"
          # Record it as a GitHub deployment. Previews stay active side by side (auto_inactive false),
          # so every open pull request keeps its own link.
          id=$(jq -n --arg ref "$GITHUB_SHA" --arg env "$env_name" --argjson prod "$prod" \
            '{ref:$ref, environment:$env, auto_merge:false, required_contexts:[], production_environment:$prod, transient_environment:($prod|not), description:"Cloudflare Pages"}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          jq -n --arg url "$link" --argjson prod "$prod" '{state:"success", environment_url:$url, auto_inactive:$prod}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --input - > /dev/null
